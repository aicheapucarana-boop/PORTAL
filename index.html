<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- link do Portal do Membro (termina em /exec) -->
<meta name="portal" content="https://script.google.com/macros/s/AKfycbzUiqCKwssrdgCJE85d4tVMrRxPuHFKuPLDnlQ4iOLz6EFr8XVe6jpfSvNMsPcYbJogjg/exec">
<title>Portal AIChE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D6B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portal AIChE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#0B3D6B;font:16px/1.45 Figtree,'Segoe UI',Arial,sans-serif;color:#fff}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F3F6F9}
  .tela{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px 24px calc(28px + env(safe-area-inset-bottom));text-align:center;box-sizing:border-box;background:radial-gradient(120% 80% at 50% 0%,#14589A 0%,#0B3D6B 45%,#06213F 100%);z-index:2;transition:opacity .35s}
  .tela.fora{opacity:0;pointer-events:none}
  .logo{width:104px;height:104px;object-fit:contain;border-radius:24px;background:#fff;padding:12px;box-sizing:border-box;box-shadow:0 14px 30px rgba(0,0,0,.3)}
  h1{margin:4px 0 0;font-size:26px}
  p{margin:0;color:rgba(255,255,255,.82);max-width:360px}
  .bt{display:block;width:100%;max-width:340px;border:0;border-radius:14px;padding:15px 18px;font:700 17px Figtree,'Segoe UI',Arial,sans-serif;cursor:pointer;text-decoration:none;box-sizing:border-box}
  .ouro{background:linear-gradient(180deg,#F5CB55,#E0A92B);color:#06213F}
  .claro{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
  .passos{max-width:340px;width:100%;text-align:left;background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;font-size:14px;color:rgba(255,255,255,.88);box-sizing:border-box}
  .passos b{color:#F5CB55}
  .pt{width:42px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden;position:relative}
  .pt::after{content:"";position:absolute;inset:0;width:40%;background:#1F9E89;animation:vai 1.1s ease-in-out infinite}
  @keyframes vai{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  a{color:#9FE3D6}
  [hidden]{display:none!important}
  .npedido{position:fixed;inset:0;z-index:10;background:rgba(6,33,63,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  .npc{width:100%;max-width:420px;background:#0B3D6B;border-radius:22px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.45)}
  .npc img{width:64px;height:64px;border-radius:16px;background:#fff;padding:6px;box-sizing:border-box}.npc b{font-size:19px}.npc p{margin:0 0 6px}
</style>
</head>
<body>
<!-- aberto pelo navegador: tela de instalação (sem o portal dentro, para o Chrome oferecer "Instalar app") -->
<div class="tela" id="inst" hidden>
  <img class="logo" src="icon-192.png" alt="">
  <h1>Portal AIChE</h1>
  <p>Instale o app para abrir o portal direto da tela inicial, já conectado.</p>
  <button class="bt ouro" id="btInst" type="button" hidden>Instalar o app</button>
  <div class="passos" id="passos"></div>
  <button class="bt claro" id="btAbrir" type="button">Abrir o portal aqui mesmo</button>
</div>
<!-- abrindo o portal -->
<div class="tela" id="abre" hidden><img class="logo" src="icon-192.png" alt=""><div>Abrindo o portal…</div><div class="pt"></div></div>
<script>
(function(){
  var PORTAL=document.querySelector('meta[name=portal]').content.trim();
  var inst=document.getElementById('inst'),abre=document.getElementById('abre');
  // o link pessoal (?acesso=...) fica guardado neste aparelho: o app instalado já entra conectado
  var K='aiche_app_acesso',q=new URLSearchParams(location.search),a=q.get('acesso');
  try{if(a&&/^M\d+\.[\w-]{16,}$/.test(a))localStorage.setItem(K,a);else a=localStorage.getItem(K);}catch(e){}
  if(q.get('sair')==='1'){try{localStorage.removeItem(K);}catch(e){}a=null;}
  if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js');}catch(e){}}
  // ===== conversa com o portal: sair, notificações e destino de uma notificação tocada =====
  var alvo=null,irPend=q.get('ir');
  function responder(m){try{if(alvo)alvo.postMessage(m,'*');}catch(e){}}
  function suporta(){return 'Notification' in window&&'serviceWorker' in navigator&&'PushManager' in window;}
  function permissao(){return suporta()?Notification.permission:'indisponivel';}
  function carregaFirebase(cb){
    if(window.firebase&&firebase.messaging){cb();return;}
    var u='https://www.gstatic.com/firebasejs/10.12.2/',s1=document.createElement('script');s1.src=u+'firebase-app-compat.js';
    s1.onload=function(){var s2=document.createElement('script');s2.src=u+'firebase-messaging-compat.js';s2.onload=cb;
      s2.onerror=function(){responder({aiche:'push-erro',msg:'sem conexão com o Firebase'});};document.head.appendChild(s2);};
    s1.onerror=function(){responder({aiche:'push-erro',msg:'sem conexão com o Firebase'});};document.head.appendChild(s1);
  }
  var ouvindo=false;
  function obterToken(d,novo){carregaFirebase(function(){try{
    if(!firebase.apps.length)firebase.initializeApp(d.cfg);
    var msg=firebase.messaging();
    if(!ouvindo){ouvindo=true;
      // com o app aberto, o aviso também aparece
      msg.onMessage(function(p){var x=(p&&p.data)||{};navigator.serviceWorker.ready.then(function(reg){
        reg.showNotification(x.titulo||'Portal AIChE',{body:x.corpo||'',icon:'icon-192.png',badge:'icon-192.png',data:{url:x.url,ir:x.ir},tag:x.ir||undefined});});});}
    navigator.serviceWorker.ready.then(function(reg){return msg.getToken({vapidKey:d.vapid,serviceWorkerRegistration:reg});})
      .then(function(t){if(t)responder({aiche:'push-token',token:t,novo:novo});else responder({aiche:'push-erro',msg:'o aparelho não gerou o endereço de aviso'});})
      .catch(function(er){responder({aiche:'push-erro',msg:er.message});});
  }catch(er){responder({aiche:'push-erro',msg:er.message});}});}
  function pedir(d){
    if(!suporta()){responder({aiche:'push-negado',perm:'indisponivel'});return;}
    if(Notification.permission==='granted'){obterToken(d,true);return;}
    // o pedido de permissão precisa de um toque nesta página: painel do próprio app
    var fundo=document.createElement('div');fundo.className='npedido';
    fundo.innerHTML='<div class="npc"><img src="icon-192.png" alt=""><b>Ativar notificações?</b><p>O Portal AIChE vai avisar sobre tarefas, pedidos, prazos e eventos.</p></div>';
    var ok=document.createElement('button');ok.className='bt ouro';ok.type='button';ok.textContent='Permitir notificações';
    var nao=document.createElement('button');nao.className='bt claro';nao.type='button';nao.textContent='Agora não';
    var caixa=fundo.firstChild;caixa.appendChild(ok);caixa.appendChild(nao);document.body.appendChild(fundo);
    nao.onclick=function(){fundo.remove();responder({aiche:'push-negado',perm:'default'});};
    ok.onclick=function(){Promise.resolve(Notification.requestPermission()).then(function(p){fundo.remove();
      if(p==='granted')obterToken(d,true);else responder({aiche:'push-negado',perm:p});});};
  }
  window.addEventListener('message',function(e){var d=e.data;if(!d||!d.aiche)return;
    if(d.aiche==='sair'){try{localStorage.removeItem(K);}catch(x){}return;}
    // link externo tocado dentro do portal: abre fora do app (formulário, Drive, site)
    if(d.aiche==='abrir'&&/^https?:\/\//i.test(String(d.url||''))){var w=null;try{w=window.open(d.url,'_blank','noopener');}catch(x){}
      if(!w){var l=document.createElement('a');l.href=d.url;l.target='_blank';l.rel='noopener';document.body.appendChild(l);l.click();l.remove();}return;}
    if(d.aiche==='oi'){alvo=e.source;responder({aiche:'app',perm:permissao(),suporta:suporta()});if(irPend){responder({aiche:'ir',ir:irPend});irPend=null;}return;}
    if(d.aiche==='push-pedir'){alvo=e.source;pedir(d);return;}
    if(d.aiche==='push-renovar'){alvo=e.source;if(permissao()==='granted')obterToken(d,false);}
  });
  // tocou num aviso com o app já aberto: o service worker manda o destino para cá
  if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',function(e){if(e.data&&e.data.aiche==='ir'&&e.data.ir)responder({aiche:'ir',ir:e.data.ir});});

  function abrirPortal(){
    inst.hidden=true;abre.hidden=false;
    var f=document.createElement('iframe');
    f.title='Portal AIChE';f.allow='clipboard-write; fullscreen';
    f.src=PORTAL+(a?(PORTAL.indexOf('?')>=0?'&':'?')+'acesso='+encodeURIComponent(a):'');
    f.addEventListener('load',function(){setTimeout(function(){abre.classList.add('fora');},600);});
    // sem link "abrir direto": um endereço script.google.com fora do app faz o Android abrir o app do Google Drive
    setTimeout(function(){if(abre.classList.contains('fora'))return;
      abre.innerHTML='<img class="logo" src="icon-192.png" alt=""><div>Está demorando mais que o normal.</div>';
      var b=document.createElement('button');b.className='bt claro';b.type='button';b.textContent='Tentar de novo';
      b.onclick=function(){abre.innerHTML='<img class="logo" src="icon-192.png" alt=""><div>Abrindo o portal…</div><div class="pt"></div>';f.src=f.src;};abre.appendChild(b);},15000);
    document.body.appendChild(f);
  }
  // aberto pelo ícone da tela inicial (o app abre com ?app=1): vai direto para o portal, em qualquer navegador
  var instalado=q.get('app')==='1'||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true||document.referrer.indexOf('android-app://')===0;
  if(instalado){abrirPortal();return;}

  // aberto no navegador: mostra a instalação
  inst.hidden=false;
  var ios=/iPhone|iPad|iPod/i.test(navigator.userAgent),passos=document.getElementById('passos');
  passos.innerHTML=ios
    ?'No iPhone (Safari): toque em <b>Compartilhar</b> (o quadrado com a seta) e depois em <b>Adicionar à Tela de Início</b>.'
    :'No Android (Chrome): toque em <b>⋮</b> no canto de cima e depois em <b>Instalar app</b> (ou <b>Adicionar à tela inicial &gt; Instalar</b>).';
  var pedido=null,btInst=document.getElementById('btInst');
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();pedido=e;btInst.hidden=false;});
  btInst.addEventListener('click',function(){if(!pedido)return;pedido.prompt();pedido.userChoice.then(function(){pedido=null;btInst.hidden=true;});});
  window.addEventListener('appinstalled',function(){passos.innerHTML='Pronto! O <b>Portal AIChE</b> está na sua tela inicial. Abra por lá.';btInst.hidden=true;});
  document.getElementById('btAbrir').addEventListener('click',abrirPortal);
})();
</script>
</body>
</html>
